<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="120" viewBox="0 0 1000 120" fill="none" role="img" aria-label="View the full portfolio">
  <defs>
    <pattern id="cg" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#16202B" stroke-width="0.6"/>
    </pattern>
    <pattern id="cscan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#22D3EE" opacity="0.05"/>
    </pattern>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#22D3EE" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <filter id="cglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cpanel"><rect x="10" y="10" width="980" height="100"/></clipPath>
    <style>.m{font-family:'JetBrains Mono','SF Mono',ui-monospace,monospace;}</style>
  </defs>

  <rect width="1000" height="120" fill="#05070B"/>
  <g clip-path="url(#cpanel)">
    <rect width="1000" height="120" fill="url(#cg)"/>
    <rect width="1000" height="120" fill="url(#wash)"/>
    <rect y="10" width="150" height="100" fill="#22D3EE" opacity="0.07">
      <animate attributeName="x" values="-150;1000" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="10" y="10" width="980" height="100" fill="none" stroke="#1C2836" stroke-width="1"/>
  <g stroke="#22D3EE" stroke-width="1.8" fill="none">
    <path d="M10,40 V10 H40"/><path d="M990,40 V10 H960"/>
    <path d="M10,80 V110 H40"/><path d="M990,80 V110 H960"/>
  </g>
  <rect x="10" y="10" width="4" height="100" fill="#22D3EE" opacity="0.85"/>

  <g class="m">
    <text x="52" y="52" font-size="10" letter-spacing="2.4" fill="#5A6B7D">// SELECTED WORK</text>
    <text x="52" y="82" font-size="24" font-weight="700" letter-spacing="4" fill="#E6F1F7">VIEW THE FULL PORTFOLIO</text>
  </g>

  <!-- marching arrow blocks -->
  <g fill="#22D3EE" filter="url(#cglow)">
    <path d="M876,52 L892,60 L876,68 Z" opacity="0.25">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" begin="0s" repeatCount="indefinite"/>
    </path>
    <path d="M898,52 L914,60 L898,68 Z" opacity="0.25">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" begin="0.2s" repeatCount="indefinite"/>
    </path>
    <path d="M920,52 L936,60 L920,68 Z" opacity="0.25">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" begin="0.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <rect width="1000" height="120" fill="url(#cscan)"/>
</svg>
