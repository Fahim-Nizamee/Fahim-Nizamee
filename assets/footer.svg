<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="130" viewBox="0 0 1000 130" fill="none" role="presentation">
  <defs>
    <linearGradient id="fg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05070B" stop-opacity="0"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="fline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <pattern id="fgrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#111A24" stroke-width="0.6"/>
    </pattern>
    <style>.m{font-family:'JetBrains Mono','SF Mono',ui-monospace,monospace;}</style>
  </defs>

  <rect width="1000" height="130" fill="#05070B"/>
  <rect width="1000" height="130" fill="url(#fgrid)"/>

  <!-- equaliser bars: blocky, no curves -->
  <g fill="#22D3EE" opacity="0.5">
    <rect x="40"  y="70" width="6" height="20"><animate attributeName="height" values="8;34;14;26;8"  dur="3.1s" repeatCount="indefinite"/><animate attributeName="y" values="82;56;76;64;82" dur="3.1s" repeatCount="indefinite"/></rect>
    <rect x="54"  y="70" width="6" height="28"><animate attributeName="height" values="26;10;32;12;26" dur="2.6s" repeatCount="indefinite"/><animate attributeName="y" values="64;80;58;78;64" dur="2.6s" repeatCount="indefinite"/></rect>
    <rect x="68"  y="70" width="6" height="16"><animate attributeName="height" values="14;30;8;22;14"  dur="3.6s" repeatCount="indefinite"/><animate attributeName="y" values="76;60;82;68;76" dur="3.6s" repeatCount="indefinite"/></rect>
    <rect x="82"  y="70" width="6" height="24"><animate attributeName="height" values="30;12;24;8;30"  dur="2.9s" repeatCount="indefinite"/><animate attributeName="y" values="60;78;66;82;60" dur="2.9s" repeatCount="indefinite"/></rect>
    <rect x="912" y="70" width="6" height="24"><animate attributeName="height" values="24;8;30;12;24"  dur="3.3s" repeatCount="indefinite"/><animate attributeName="y" values="66;82;60;78;66" dur="3.3s" repeatCount="indefinite"/></rect>
    <rect x="926" y="70" width="6" height="16"><animate attributeName="height" values="10;28;14;32;10"  dur="2.7s" repeatCount="indefinite"/><animate attributeName="y" values="80;62;76;58;80" dur="2.7s" repeatCount="indefinite"/></rect>
    <rect x="940" y="70" width="6" height="28"><animate attributeName="height" values="32;14;8;26;32"  dur="3.8s" repeatCount="indefinite"/><animate attributeName="y" values="58;76;82;64;58" dur="3.8s" repeatCount="indefinite"/></rect>
    <rect x="954" y="70" width="6" height="20"><animate attributeName="height" values="12;26;30;10;12"  dur="3.0s" repeatCount="indefinite"/><animate attributeName="y" values="78;64;60;80;78" dur="3.0s" repeatCount="indefinite"/></rect>
  </g>

  <rect x="0" y="44" width="1000" height="1" fill="url(#fline)"/>
  <g fill="#22D3EE" opacity="0.5">
    <rect x="470" y="40" width="2" height="9"/>
    <rect x="528" y="40" width="2" height="9"/>
  </g>

  <g class="m" text-anchor="middle">
    <text x="500" y="78" font-size="12" letter-spacing="4" fill="#5A6B7D">END OF TRANSMISSION</text>
    <text x="500" y="100" font-size="10" letter-spacing="2" fill="#33414F">THANKS FOR SCROLLING</text>
  </g>
  <rect x="614" y="68" width="8" height="13" fill="#22D3EE">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <rect y="100" width="1000" height="30" fill="url(#fg)"/>
</svg>
