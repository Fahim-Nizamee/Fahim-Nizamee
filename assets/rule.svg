<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="14" viewBox="0 0 1000 14" fill="none" role="presentation">
  <defs>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#22D3EE" stop-opacity="0.45"/>
      <stop offset="82%"  stop-color="#22D3EE" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <filter id="gl" x="-300%" y="-600%" width="700%" height="1300%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="6" width="1000" height="1" fill="url(#r)"/>

  <g fill="#22D3EE" opacity="0.30">
    <rect x="120" y="3" width="1" height="7"/><rect x="260" y="3" width="1" height="7"/>
    <rect x="400" y="3" width="1" height="7"/><rect x="600" y="3" width="1" height="7"/>
    <rect x="740" y="3" width="1" height="7"/><rect x="880" y="3" width="1" height="7"/>
  </g>

  <g fill="#22D3EE" opacity="0.55">
    <rect x="486" y="2" width="2" height="9"/>
    <rect x="512" y="2" width="2" height="9"/>
  </g>

  <rect y="3" width="26" height="7" fill="#22D3EE" filter="url(#gl)">
    <animate attributeName="x" values="40;934;40" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.95;0.95;0" keyTimes="0;0.06;0.94;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <rect y="5" width="10" height="3" fill="#7DD3FC">
    <animate attributeName="x" values="934;40;934" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.06;0.94;1" dur="11s" repeatCount="indefinite"/>
  </rect>
</svg>
