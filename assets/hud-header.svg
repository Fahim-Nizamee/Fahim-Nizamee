<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" fill="none" role="img" aria-label="Fahim Nizamee — Full-Stack Developer">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#16202B" stroke-width="0.6"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#22D3EE" opacity="0.05"/>
    </pattern>
    <linearGradient id="sweepFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="panel"><rect x="16" y="16" width="968" height="268"/></clipPath>
    <clipPath id="typeClip">
      <rect x="64" y="164" width="0" height="26">
        <animate attributeName="width" values="0;430;430;0;0" keyTimes="0;0.40;0.80;0.94;1" dur="13s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <style>
      .m  { font-family:'JetBrains Mono','SF Mono',ui-monospace,monospace; }
      .tk { font-size:10px; letter-spacing:1.6px; fill:#5A6B7D; }
    </style>
  </defs>

  <rect width="1000" height="300" fill="#05070B"/>

  <g clip-path="url(#panel)">
    <rect width="1000" height="300" fill="url(#grid)"/>

    <!-- horizontal scan sweep -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,-90;0,300;0,-90" dur="9s" repeatCount="indefinite"/>
      <rect x="16" y="0" width="968" height="90" fill="url(#sweepFade)" opacity="0.16"/>
      <rect x="16" y="89" width="968" height="1" fill="#22D3EE" opacity="0.55"/>
    </g>
  </g>

  <!-- frame -->
  <rect x="16" y="16" width="968" height="268" fill="none" stroke="#16202B" stroke-width="1"/>
  <g stroke="#22D3EE" stroke-width="1.8" fill="none">
    <path d="M16,50 V16 H50"/>
    <path d="M984,50 V16 H950"/>
    <path d="M16,250 V284 H50"/>
    <path d="M984,250 V284 H950"/>
  </g>
  <rect x="16" y="16" width="968" height="1.5" fill="url(#edge)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- top status strip -->
  <g class="m tk">
    <rect x="64" y="48" width="7" height="7" fill="#FBBF24">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <text x="80" y="56" fill="#22D3EE">SYSTEM ONLINE</text>
    <text x="936" y="56" text-anchor="end">LOC 23.8N 90.4E // DHAKA BD</text>
  </g>

  <!-- name + glitch layers -->
  <g class="m" font-size="46" font-weight="700" letter-spacing="9">
    <text x="62" y="128" fill="#7DD3FC" opacity="0">
      <animate attributeName="opacity" values="0;0;0.65;0;0.45;0;0" keyTimes="0;0.60;0.618;0.636;0.654;0.672;1" dur="8s" repeatCount="indefinite"/>
      FAHIM NIZAMEE
    </text>
    <text x="66" y="128" fill="#0EA5B7" opacity="0">
      <animate attributeName="opacity" values="0;0;0.55;0;0.4;0;0" keyTimes="0;0.605;0.623;0.641;0.659;0.677;1" dur="8s" repeatCount="indefinite"/>
      FAHIM NIZAMEE
    </text>
    <text x="64" y="128" fill="#E6F1F7">FAHIM NIZAMEE</text>
  </g>
  <!-- glitch tear -->
  <rect x="64" y="104" width="330" height="7" fill="#05070B" opacity="0">
    <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.62;0.632;0.644;1" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- typed role line -->
  <g clip-path="url(#typeClip)">
    <text class="m" x="64" y="183" font-size="17" letter-spacing="1.4" fill="#8FA3B8" xml:space="preserve"><tspan fill="#22D3EE">&#62; </tspan>FULL-STACK DEVELOPER</text>
  </g>
  <rect y="165" width="10" height="22" fill="#22D3EE">
    <animate attributeName="x" values="64;494;494;64;64" keyTimes="0;0.40;0.80;0.94;1" dur="13s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- status blocks (chamfered, zero radius) -->
  <g class="m" font-size="11" letter-spacing="1.4">
    <g>
      <path d="M70,210 H210 V228 L204,234 H64 V216 Z" fill="#22D3EE" fill-opacity="0.10" stroke="#22D3EE" stroke-opacity="0.6"/>
      <rect x="64" y="210" width="3" height="24" fill="#22D3EE"/>
      <rect x="78" y="218" width="6" height="6" fill="#FBBF24">
        <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="94" y="226" fill="#E6F1F7">OPEN TO WORK</text>
    </g>
    <g>
      <path d="M232,210 H372 V228 L366,234 H226 V216 Z" fill="#7DD3FC" fill-opacity="0.07" stroke="#7DD3FC" stroke-opacity="0.45"/>
      <rect x="226" y="210" width="3" height="24" fill="#7DD3FC"/>
      <text x="242" y="226" fill="#E6F1F7">MERN / DJANGO</text>
    </g>
    <g>
      <path d="M394,210 H528 V228 L522,234 H388 V216 Z" fill="#8FA3B8" fill-opacity="0.06" stroke="#8FA3B8" stroke-opacity="0.35"/>
      <rect x="388" y="210" width="3" height="24" fill="#8FA3B8"/>
      <text x="404" y="226" fill="#E6F1F7">ALWAYS SHIPPING</text>
    </g>
  </g>

  <!-- bottom rail -->
  <g class="m tk">
    <text x="64" y="270">BUILD 2026.08 // STATUS: ACTIVE</text>
    <text x="936" y="270" text-anchor="end">FAHIM-NIZAMEE.DEV</text>
  </g>

  <!-- right edge ruler -->
  <g stroke="#16202B" stroke-width="1">
    <line x1="965" y1="80" x2="984" y2="80"/><line x1="972" y1="94" x2="984" y2="94"/>
    <line x1="972" y1="108" x2="984" y2="108"/><line x1="965" y1="122" x2="984" y2="122"/>
    <line x1="972" y1="136" x2="984" y2="136"/><line x1="972" y1="150" x2="984" y2="150"/>
    <line x1="965" y1="164" x2="984" y2="164"/><line x1="972" y1="178" x2="984" y2="178"/>
    <line x1="972" y1="192" x2="984" y2="192"/><line x1="965" y1="206" x2="984" y2="206"/>
  </g>

  <rect width="1000" height="300" fill="url(#scan)"/>
</svg>
