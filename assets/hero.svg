<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" fill="none" role="img" aria-label="Fahim Nizamee — Full-Stack Developer">
  <defs>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#22D3EE;#F472B6;#8B5CF6" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#F472B6;#8B5CF6;#22D3EE" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#F472B6">
        <animate attributeName="stop-color" values="#F472B6;#8B5CF6;#22D3EE;#F472B6" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="travel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#161B22" stroke-width="1"/>
    </pattern>

    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="card"><rect x="1" y="1" width="998" height="258" rx="20"/></clipPath>
    <clipPath id="typeClip">
      <rect x="64" y="150" width="0" height="34">
        <animate attributeName="width" values="0;650;650;0;0" keyTimes="0;0.42;0.80;0.95;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="998" height="258" rx="20" fill="#0B0E14"/>

  <g clip-path="url(#card)">
    <rect width="1000" height="260" fill="url(#grid)" opacity="0.55"/>

    <!-- drifting light -->
    <circle r="120" fill="#8B5CF6" opacity="0.30" filter="url(#blur)">
      <animate attributeName="cx" values="180;760;420;180" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="70;190;40;70"    dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle r="105" fill="#22D3EE" opacity="0.22" filter="url(#blur)">
      <animate attributeName="cx" values="820;300;900;820" dur="22s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="200;60;160;200"  dur="22s" repeatCount="indefinite"/>
    </circle>

    <!-- floating particles -->
    <g fill="#8B5CF6">
      <circle cx="120" cy="220" r="2">
        <animate attributeName="cy" values="230;30;230" dur="11s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.9;0" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle cx="905" cy="180" r="2.4" fill="#22D3EE">
        <animate attributeName="cy" values="240;40;240" dur="14s" begin="-3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.9;0" dur="14s" begin="-3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="680" cy="200" r="1.8" fill="#F472B6">
        <animate attributeName="cy" values="235;50;235" dur="9s" begin="-5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.8;0" dur="9s" begin="-5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="300" cy="60" r="2">
        <animate attributeName="cy" values="220;35;220" dur="16s" begin="-8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.7;0" dur="16s" begin="-8s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- static border + traveling light along the edge -->
  <rect x="1" y="1" width="998" height="258" rx="20" fill="none" stroke="#1F2430" stroke-width="1.5"/>
  <rect x="1" y="1" width="998" height="258" rx="20" fill="none" stroke="url(#travel)" stroke-width="2.5"
        stroke-linecap="round" stroke-dasharray="150 2340" filter="url(#soft)">
    <animate attributeName="stroke-dashoffset" from="2490" to="0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- window dots -->
  <g>
    <circle cx="34" cy="30" r="5" fill="#FF5F57"/>
    <circle cx="52" cy="30" r="5" fill="#FEBC2E"/>
    <circle cx="70" cy="30" r="5" fill="#28C840"/>
  </g>
  <text x="966" y="35" text-anchor="end" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace"
        font-size="12" fill="#4B5563" letter-spacing="1.5">~/fahim-nizamee</text>

  <!-- name -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.2s" fill="freeze"/>
    <text x="64" y="112" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace"
          font-size="58" font-weight="700" letter-spacing="2" fill="url(#nameGrad)" filter="url(#soft)">
      Fahim Nizamee
      <animate attributeName="y" from="126" to="112" dur="1s" begin="0.2s" fill="freeze"/>
    </text>
  </g>

  <!-- typed subtitle -->
  <g clip-path="url(#typeClip)">
    <text x="64" y="175" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace"
          font-size="20" fill="#8B94A7" xml:space="preserve"><tspan fill="#22D3EE">$ </tspan>full-stack developer<tspan fill="#3F4757"> · </tspan>react<tspan fill="#3F4757"> · </tspan>next<tspan fill="#3F4757"> · </tspan>node<tspan fill="#3F4757"> · </tspan>django</text>
  </g>
  <rect y="152" width="11" height="26" fill="#8B5CF6">
    <animate attributeName="x" values="64;714;714;64;64" keyTimes="0;0.42;0.80;0.95;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- status chips -->
  <g font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="12">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.4s" fill="freeze"/>
      <rect x="64" y="204" width="132" height="26" rx="13" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-opacity="0.45"/>
      <circle cx="80" cy="217" r="4" fill="#28C840">
        <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="92" y="221" fill="#C9D1D9">open to work</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.7s" fill="freeze"/>
      <rect x="206" y="204" width="120" height="26" rx="13" fill="#22D3EE" fill-opacity="0.10" stroke="#22D3EE" stroke-opacity="0.40"/>
      <text x="222" y="221" fill="#C9D1D9">Bangladesh</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="2s" fill="freeze"/>
      <rect x="336" y="204" width="176" height="26" rx="13" fill="#F472B6" fill-opacity="0.10" stroke="#F472B6" stroke-opacity="0.35"/>
      <text x="352" y="221" fill="#C9D1D9">always shipping</text>
    </g>
  </g>

</svg>
