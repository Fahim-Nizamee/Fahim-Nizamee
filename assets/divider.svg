<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="12" viewBox="0 0 1000 12" fill="none" role="presentation">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="50%"  stop-color="#22D3EE" stop-opacity="0.75"/>
      <stop offset="80%"  stop-color="#F472B6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-200%" y="-400%" width="500%" height="900%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="5" width="1000" height="1.6" rx="0.8" fill="url(#line)"/>

  <circle cy="6" r="3.5" fill="#22D3EE" filter="url(#g)">
    <animate attributeName="cx" values="40;960;40" dur="7s" repeatCount="indefinite" calcMode="spline"
             keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cy="6" r="2" fill="#8B5CF6" filter="url(#g)">
    <animate attributeName="cx" values="960;40;960" dur="9s" repeatCount="indefinite" calcMode="spline"
             keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.08;0.92;1" dur="9s" repeatCount="indefinite"/>
  </circle>
</svg>
