<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" fill="none" role="img" aria-label="Tech stack orbit">
  <defs>
    <radialGradient id="core">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .pill { font-family: 'JetBrains Mono','SF Mono',ui-monospace,monospace; font-size: 12px; fill: #E6EDF3; }
      .r1 { fill: #8B5CF6; }
      .r2 { fill: #22D3EE; }
      .r3 { fill: #F472B6; }
    </style>
  </defs>

  <rect width="1000" height="400" rx="20" fill="#0B0E14"/>
  <rect x="0.75" y="0.75" width="998.5" height="398.5" rx="20" fill="none" stroke="#1F2430" stroke-width="1.5"/>

  <g transform="translate(500,200)">
    <circle r="150" fill="url(#core)"/>

    <!-- orbit rings -->
    <circle r="80"  fill="none" stroke="#8B5CF6" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="4 7"/>
    <circle r="135" fill="none" stroke="#22D3EE" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="4 9"/>
    <circle r="190" fill="none" stroke="#F472B6" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="4 11"/>

    <!-- pulsing core -->
    <circle r="46" fill="#0D1117" stroke="#8B5CF6" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle r="46" fill="none" stroke="#22D3EE" stroke-width="1.5" filter="url(#glow)">
      <animate attributeName="r" values="46;74;46" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.7;0;0.7" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text class="pill" y="-3" text-anchor="middle" font-size="14" font-weight="700" fill="#8B5CF6">STACK</text>
    <text class="pill" y="15" text-anchor="middle" font-size="10" fill="#6B7280">2026</text>

    <!-- ring 1 : languages -->
    <g>
      <g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="26s" repeatCount="indefinite"/>
        <g transform="translate(80,0)"><g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="26s" repeatCount="indefinite"/>
          <rect x="-47" y="-13" width="94" height="26" rx="13" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-opacity="0.55"/>
          <text class="pill" y="4" text-anchor="middle">TypeScript</text>
        </g></g>
      </g>
      <g><animateTransform attributeName="transform" type="rotate" from="120 0 0" to="480 0 0" dur="26s" repeatCount="indefinite"/>
        <g transform="translate(80,0)"><g><animateTransform attributeName="transform" type="rotate" from="-120 0 0" to="-480 0 0" dur="26s" repeatCount="indefinite"/>
          <rect x="-33" y="-13" width="66" height="26" rx="13" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-opacity="0.55"/>
          <text class="pill" y="4" text-anchor="middle">Python</text>
        </g></g>
      </g>
      <g><animateTransform attributeName="transform" type="rotate" from="240 0 0" to="600 0 0" dur="26s" repeatCount="indefinite"/>
        <g transform="translate(80,0)"><g><animateTransform attributeName="transform" type="rotate" from="-240 0 0" to="-600 0 0" dur="26s" repeatCount="indefinite"/>
          <rect x="-23" y="-13" width="46" height="26" rx="13" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-opacity="0.55"/>
          <text class="pill" y="4" text-anchor="middle">C++</text>
        </g></g>
      </g>
    </g>

    <!-- ring 2 : frameworks (counter-rotating) -->
    <g>
      <g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="38s" repeatCount="indefinite"/>
        <g transform="translate(135,0)"><g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="38s" repeatCount="indefinite"/>
          <rect x="-29" y="-13" width="58" height="26" rx="13" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.5"/>
          <text class="pill" y="4" text-anchor="middle">React</text>
        </g></g>
      </g>
      <g><animateTransform attributeName="transform" type="rotate" from="-72 0 0" to="-432 0 0" dur="38s" repeatCount="indefinite"/>
        <g transform="translate(135,0)"><g><animateTransform attributeName="transform" type="rotate" from="72 0 0" to="432 0 0" dur="38s" repeatCount="indefinite"/>
          <rect x="-36" y="-13" width="72" height="26" rx="13" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.5"/>
          <text class="pill" y="4" text-anchor="middle">Next.js</text>
        </g></g>
      </g>
      <g><animateTransform attributeName="transform" type="rotate" from="-144 0 0" to="-504 0 0" dur="38s" repeatCount="indefinite"/>
        <g transform="translate(135,0)"><g><animateTransform attributeName="transform" type="rotate" from="144 0 0" to="504 0 0" dur="38s" repeatCount="indefinite"/>
          <rect x="-36" y="-13" width="72" height="26" rx="13" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.5"/>
          <text class="pill" y="4" text-anchor="middle">Node.js</text>
        </g></g>
      </g>
      <g><animateTransform attributeName="transform" type="rotate" from="-216 0 0" to="-576 0 0" dur="38s" repeatCount="indefinite"/>
        <g transform="translate(135,0)"><g><animateTransform attributeName="transform" type="rotate" from="216 0 0" to="576 0 0" dur="38s" repeatCount="indefinite"/>
          <rect x="-33" y="-13" width="66" height="26" rx="13" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.5"/>
          <text class="pill" y="4" text-anchor="middle">Django</text>
        </g></g>
      </g>
      <g><animateTransform attributeName="transform" type="rotate" from="-288 0 0" to="-648 0 0" dur="38s" repeatCount="indefinite"/>
        <g transform="translate(135,0)"><g><animateTransform attributeName="transform" type="rotate" from="288 0 0" to="648 0 0" dur="38s" repeatCount="indefinite"/>
          <rect x="-40" y="-13" width="80" height="26" rx="13" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.5"/>
          <text class="pill" y="4" text-anchor="middle">Tailwind</text>
        </g></g>
      </g>
    </g>

    <!-- ring 3 : data & platform -->
    <g>
      <g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="54s" repeatCount="indefinite"/>
        <g transform="translate(190,0)"><g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="54s" repeatCount="indefinite"/>
          <rect x="-36" y="-13" width="72" height="26" rx="13" fill="#F472B6" fill-opacity="0.10" stroke="#F472B6" stroke-opacity="0.45"/>
          <text class="pill" y="4" text-anchor="middle">MongoDB</text>
        </g></g>
      </g>
      <g><animateTransform attributeName="transform" type="rotate" from="51 0 0" to="411 0 0" dur="54s" repeatCount="indefinite"/>
        <g transform="translate(190,0)"><g><animateTransform attributeName="transform" type="rotate" from="-51 0 0" to="-411 0 0" dur="54s" repeatCount="indefinite"/>
          <rect x="-47" y="-13" width="94" height="26" rx="13" fill="#F472B6" fill-opacity="0.10" stroke="#F472B6" stroke-opacity="0.45"/>
          <text class="pill" y="4" text-anchor="middle">PostgreSQL</text>
        </g></g>
      </g>
      <g><animateTransform attributeName="transform" type="rotate" from="103 0 0" to="463 0 0" dur="54s" repeatCount="indefinite"/>
        <g transform="translate(190,0)"><g><animateTransform attributeName="transform" type="rotate" from="-103 0 0" to="-463 0 0" dur="54s" repeatCount="indefinite"/>
          <rect x="-33" y="-13" width="66" height="26" rx="13" fill="#F472B6" fill-opacity="0.10" stroke="#F472B6" stroke-opacity="0.45"/>
          <text class="pill" y="4" text-anchor="middle">Prisma</text>
        </g></g>
      </g>
      <g><animateTransform attributeName="transform" type="rotate" from="154 0 0" to="514 0 0" dur="54s" repeatCount="indefinite"/>
        <g transform="translate(190,0)"><g><animateTransform attributeName="transform" type="rotate" from="-154 0 0" to="-514 0 0" dur="54s" repeatCount="indefinite"/>
          <rect x="-40" y="-13" width="80" height="26" rx="13" fill="#F472B6" fill-opacity="0.10" stroke="#F472B6" stroke-opacity="0.45"/>
          <text class="pill" y="4" text-anchor="middle">Firebase</text>
        </g></g>
      </g>
      <g><animateTransform attributeName="transform" type="rotate" from="206 0 0" to="566 0 0" dur="54s" repeatCount="indefinite"/>
        <g transform="translate(190,0)"><g><animateTransform attributeName="transform" type="rotate" from="-206 0 0" to="-566 0 0" dur="54s" repeatCount="indefinite"/>
          <rect x="-36" y="-13" width="72" height="26" rx="13" fill="#F472B6" fill-opacity="0.10" stroke="#F472B6" stroke-opacity="0.45"/>
          <text class="pill" y="4" text-anchor="middle">Flutter</text>
        </g></g>
      </g>
      <g><animateTransform attributeName="transform" type="rotate" from="257 0 0" to="617 0 0" dur="54s" repeatCount="indefinite"/>
        <g transform="translate(190,0)"><g><animateTransform attributeName="transform" type="rotate" from="-257 0 0" to="-617 0 0" dur="54s" repeatCount="indefinite"/>
          <rect x="-33" y="-13" width="66" height="26" rx="13" fill="#F472B6" fill-opacity="0.10" stroke="#F472B6" stroke-opacity="0.45"/>
          <text class="pill" y="4" text-anchor="middle">Vercel</text>
        </g></g>
      </g>
      <g><animateTransform attributeName="transform" type="rotate" from="309 0 0" to="669 0 0" dur="54s" repeatCount="indefinite"/>
        <g transform="translate(190,0)"><g><animateTransform attributeName="transform" type="rotate" from="-309 0 0" to="-669 0 0" dur="54s" repeatCount="indefinite"/>
          <rect x="-29" y="-13" width="58" height="26" rx="13" fill="#F472B6" fill-opacity="0.10" stroke="#F472B6" stroke-opacity="0.45"/>
          <text class="pill" y="4" text-anchor="middle">Flask</text>
        </g></g>
      </g>
    </g>
  </g>
</svg>
